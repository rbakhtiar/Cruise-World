
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cruise World</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');

* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #a9c9d4;
  font-family: 'Outfit', sans-serif;
  color: white;
  user-select: none;
}

canvas {
  display: block;
  position: fixed;
  inset: 0;
}

#loading {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #101a1a;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 14px;
  transition: opacity .8s;
}

.logo {
  font-size: 38px;
  font-weight: 800;
  letter-spacing: 5px;
}

.logo span { color: #64d9a4; }

#loading p {
  color: #9aada7;
  font-size: 12px;
  letter-spacing: 3px;
}

.loader {
  width: 170px;
  height: 3px;
  background: #30413b;
  border-radius: 10px;
  overflow: hidden;
}

.loader div {
  width: 0%;
  height: 100%;
  background: #64d9a4;
  transition: width .2s;
}

#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  display: none;
}

.topbar {
  position: absolute;
  top: 20px;
  left: 22px;
  right: 22px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.brand {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 3px;
  text-shadow: 0 2px 10px #0008;
}

.brand span { color: #71e0a9; }

.status {
  background: #101b1baf;
  border: 1px solid #ffffff20;
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 11px;
  color: #c8d9d2;
  backdrop-filter: blur(12px);
}

.speedbox {
  position: absolute;
  bottom: 25px;
  left: 25px;
  background: #101b1bd9;
  border: 1px solid #ffffff25;
  border-radius: 18px;
  padding: 15px 22px;
  min-width: 145px;
  backdrop-filter: blur(12px);
}

.speed {
  font-size: 42px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.speed small {
  font-size: 11px;
  color: #a9b9b2;
  font-weight: 400;
}

.speed-label {
  color: #75dda9;
  font-size: 10px;
  letter-spacing: 3px;
  margin-top: 7px;
}

.help {
  position: absolute;
  bottom: 25px;
  right: 25px;
  background: #101b1bd9;
  padding: 14px 18px;
  border: 1px solid #ffffff25;
  border-radius: 13px;
  font-size: 11px;
  color: #bdcec6;
  line-height: 2;
}

.help b { color: white; }

#mobileControls {
  display: none;
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  gap: 12px;
  align-items: end;
  pointer-events: auto;
}

.controlGroup {
  display: flex;
  gap: 9px;
}

.ctrl {
  width: 58px;
  height: 58px;
  border-radius: 16px;
  background: #152a28cc;
  color: white;
  border: 1px solid #ffffff40;
  font-size: 21px;
  font-weight: 700;
  touch-action: none;
}

.ctrl:active {
  background: #51bb8a;
  color: #07130e;
}

#reset {
  position: absolute;
  top: 75px;
  right: 22px;
  pointer-events: auto;
  border: 1px solid #ffffff35;
  background: #142522cc;
  color: white;
  border-radius: 10px;
  padding: 10px 15px;
  font-family: inherit;
}

@media(max-width:700px) {
  .topbar { top: 12px; left: 13px; right: 13px; }
  .brand { font-size: 16px; }
  .status { font-size: 9px; padding: 8px; }
  .speedbox { bottom: 18px; left: 12px; padding: 12px; min-width: 110px; }
  .speed { font-size: 32px; }
  .help { display: none; }
  #mobileControls { display: flex; }
  #reset { top: 60px; right: 12px; }
}
</style>
</head>

<body>

<div id="loading">
  <div class="logo">CRUISE <span>WORLD</span></div>
  <p>PREPARING YOUR WORLD</p>
  <div class="loader"><div id="progress"></div></div>
  <div id="loadText" style="font-size:11px;color:#78958a">Loading 3D engine...</div>
</div>

<div id="hud">
  <div class="topbar">
    <div class="brand">CRUISE <span>WORLD</span></div>
    <div class="status">OPEN WORLD &nbsp; • &nbsp; FREE DRIVE</div>
  </div>

  <button id="reset">↻ Reset car</button>

  <div class="speedbox">
    <div class="speed"><span id="speed">0</span> <small>KM/H</small></div>
    <div class="speed-label">CURRENT SPEED</div>
  </div>

  <div class="help">
    <b>W / ↑</b> Accelerate<br>
    <b>S / ↓</b> Brake / Reverse<br>
    <b>A / D</b> Steering<br>
    <b>SPACE</b> Handbrake<br>
    <b>R</b> Reset vehicle
  </div>

  <div id="mobileControls">
    <div class="controlGroup">
      <button class="ctrl" data-key="a">←</button>
      <button class="ctrl" data-key="d">→</button>
    </div>
    <div class="controlGroup">
      <button class="ctrl" data-key="s">▼</button>
      <button class="ctrl" data-key="w">▲</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ==========================================
   CRUISE WORLD - GAME CONFIGURATION
========================================== */

// Change these paths to match your downloaded assets.
const ASSETS = {
  city: 'assets/city.glb',
  car: 'assets/car.glb',
  trees: 'assets/tree.glb',
  buildings: 'assets/building.glb'
};

// Set to true when your city model already contains roads.
const CITY_HAS_ROADS = true;

// If the car faces the wrong direction, change this.
const CAR_ROTATION = 0;

// Game configuration
const CONFIG = {
  acceleration: 24,
  reverseAcceleration: 12,
  maxSpeed: 55,
  maxReverse: 15,
  friction: 9,
  steeringSpeed: 1.7,
  cameraDistance: 10,
  cameraHeight: 5
};

const loading = document.getElementById('loading');
const progress = document.getElementById('progress');
const loadText = document.getElementById('loadText');
const hud = document.getElementById('hud');
const speedDisplay = document.getElementById('speed');

let scene, camera, renderer, clock;
let car, carModel;
let velocity = 0;
let steering = 0;
let heading = 0;
let loadedAssets = 0;

const keys = {};
const loader = new GLTFLoader();

/* ==========================================
   INITIALIZATION
========================================== */

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9bc4d4);
  scene.fog = new THREE.Fog(0x9bc4d4, 100, 500);

  camera = new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    1500
  );

  camera.position.set(0, 6, 12);

  renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
  });

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;

  document.body.appendChild(renderer.domElement);

  clock = new THREE.Clock();

  setupLighting();
  createGround();

  if (!CITY_HAS_ROADS) createRoads();
  createFallbackCity();

  createCar();
  loadAssets();

  window.addEventListener('resize', onResize);
  setupControls();
  animate();
}

/* ==========================================
   LIGHTING
========================================== */

function setupLighting() {
  const hemisphere = new THREE.HemisphereLight(
    0xd9edff,
    0x55634b,
    2
  );
  scene.add(hemisphere);

  const sun = new THREE.DirectionalLight(0xfff0d7, 3);
  sun.position.set(-80, 130, 60);
  sun.castShadow = true;

  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -150;
  sun.shadow.camera.right = 150;
  sun.shadow.camera.top = 150;
  sun.shadow.camera.bottom = -150;

  scene.add(sun);
}

/* ==========================================
   GROUND
========================================== */

function createGround() {
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(2000, 2000),
    new THREE.MeshStandardMaterial({
      color: 0x6c8c63,
      roughness: 1
    })
  );

  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.06;
  ground.receiveShadow = true;
  scene.add(ground);
}

/* ==========================================
   PROCEDURAL ROAD SYSTEM
========================================== */

function createRoads() {
  const roadMaterial = new THREE.MeshStandardMaterial({
    color: 0x303438,
    roughness: 0.95
  });

  const lineMaterial = new THREE.MeshBasicMaterial({
    color: 0xe8e4c9
  });

  function road(width, length, x, z, rotation = 0) {
    const group = new THREE.Group();

    const surface = new THREE.Mesh(
      new THREE.BoxGeometry(width, 0.12, length),
      roadMaterial
    );

    surface.position.y = 0.01;
    surface.receiveShadow = true;
    group.add(surface);

    // Road lane markings
    if (width > 10) {
      for (let i = -length / 2 + 5; i < length / 2; i += 9) {
        const line = new THREE.Mesh(
          new THREE.BoxGeometry(0.16, 0.025, 4),
          lineMaterial
        );
        line.position.set(0, 0.085, i);
        group.add(line);
      }
    }

    group.position.set(x, 0, z);
    group.rotation.y = rotation;
    scene.add(group);
  }

  // Main streets
  road(18, 900, 0, 0);
  road(18, 900, 90, 0);
  road(18, 900, -90, 0);
  road(900, 18, 0, 0, Math.PI / 2);
  road(900, 18, 0, 90, Math.PI / 2);
  road(900, 18, 0, -90, Math.PI / 2);

  // Smaller streets
  for (let i = -4; i <= 4; i++) {
    if (i === 0) continue;
    road(10, 900, i * 45, 0);
    road(900, 10, 0, i * 45, Math.PI / 2);
  }
}

/* ==========================================
   FALLBACK CITY
   Used when custom assets aren't found.
========================================== */

function createFallbackCity() {
  const buildingColors = [
    0xb3b9b5, 0xc1b7a5, 0x8e9da5,
    0xb9c5c7, 0x9caa9e, 0xd1c9b9
  ];

  for (let x = -5; x <= 5; x++) {
    for (let z = -5; z <= 5; z++) {
      if (Math.abs(x * 45) < 22 ||
          Math.abs(z * 45) < 22) continue;

      if (Math.random() > 0.82) continue;

      const bx = x * 45 + (Math.random() - 0.5) * 12;
      const bz = z * 45 + (Math.random() - 0.5) * 12;

      const w = 13 + Math.random() * 12;
      const d = 13 + Math.random() * 12;
      const h = 12 + Math.random() * 48;

      const material = new THREE.MeshStandardMaterial({
        color: buildingColors[
          Math.floor(Math.random() * buildingColors.length)
        ],
        roughness: 0.85
      });

      const building = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        material
      );

      building.position.set(bx, h / 2, bz);
      building.castShadow = true;
      building.receiveShadow = true;
      scene.add(building);

      // Windows
      const windowMat = new THREE.MeshStandardMaterial({
        color: 0x314a54,
        roughness: 0.25,
        metalness: 0.2
      });

      const windows = new THREE.Mesh(
        new THREE.BoxGeometry(w * 0.7, h * 0.7, 0.08),
        windowMat
      );

      windows.position.set(bx, h * 0.56, bz + d / 2 + 0.05);
      scene.add(windows);
    }
  }

  // Procedural trees
  const trunkMat = new THREE.MeshStandardMaterial({
    color: 0x60422d
  });

  const leafMat = new THREE.MeshStandardMaterial({
    color: 0x326b40,
    roughness: 1
  });

  for (let i = 0; i < 160; i++) {
    const x = (Math.random() - 0.5) * 800;
    const z = (Math.random() - 0.5) * 800;

    // Avoid the major roads
    if (Math.abs(x % 45) < 12 ||
        Math.abs(z % 45) < 12) continue;

    const tree = new THREE.Group();

    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3, 0.45, 3, 7),
      trunkMat
    );
    trunk.position.y = 1.5;
    tree.add(trunk);

    const leaves = new THREE.Mesh(
      new THREE.SphereGeometry(2.3, 8, 7),
      leafMat
    );
    leaves.position.y = 4.3;
    tree.add(leaves);

    tree.position.set(x, 0, z);
    tree.traverse(o => {
      if (o.isMesh) o.castShadow = true;
    });

    scene.add(tree);
  }
}

/* ==========================================
   CAR
========================================== */

function createCar() {
  car = new THREE.Group();
  car.position.set(0, 0.4, 0);

  // Temporary car body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2.1, 0.65, 4.2),
    new THREE.MeshStandardMaterial({
      color: 0x138e68,
      metalness: 0.65,
      roughness: 0.28
    })
  );

  body.position.y = 0.65;
  body.castShadow = true;
  car.add(body);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.65, 0.75, 1.9),
    new THREE.MeshStandardMaterial({
      color: 0x263b40,
      metalness: 0.5,
      roughness: 0.2
    })
  );

  cabin.position.set(0, 1.3, -0.25);
  cabin.castShadow = true;
  car.add(cabin);

  const wheelMat = new THREE.MeshStandardMaterial({
    color: 0x151719,
    roughness: 0.9
  });

  const wheels = [];

  for (const x of [-1.05, 1.05]) {
    for (const z of [-1.3, 1.3]) {
      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.42, 0.42, 0.25, 20),
        wheelMat
      );

      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(x, 0.42, z);
      wheel.castShadow = true;
      car.add(wheel);
      wheels.push(wheel);
    }
  }

  // Headlights
  const headlightMat = new THREE.MeshBasicMaterial({
    color: 0xfff2c5
  });

  for (const x of [-0.72, 0.72]) {
    const light = new THREE.Mesh(
      new THREE.BoxGeometry(0.35, 0.18, 0.08),
      headlightMat
    );
    light.position.set(x, 0.7, -2.12);
    car.add(light);
  }

  car.userData.wheels = wheels;
  scene.add(car);

  car.rotation.y = CAR_ROTATION;
}

/* ==========================================
   LOAD YOUR DOWNLOADED ASSETS
========================================== */

function loadModel(path, onSuccess, scale = 1) {
  loader.load(
    path,
    (gltf) => {
      const model = gltf.scene;
      model.scale.setScalar(scale);

      model.traverse(obj => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
        }
      });

      onSuccess(model);
      loadedAssets++;
      updateProgress();
    },
    undefined,
    (error) => {
      console.warn('Asset unavailable:', path);
      loadedAssets++;
      updateProgress();
    }
  );
}

function updateProgress() {
  const percentage = Math.min(100, loadedAssets * 25);
  progress.style.width = percentage + '%';
}

function loadAssets() {
  // Load full city environment
  loadModel(ASSETS.city, (model) => {
    scene.add(model);

    // Hide procedural buildings when custom city exists
    // You can instead remove the fallback city entirely.
  });

  // Load vehicle
  loadModel(ASSETS.car, (model) => {
    scene.remove(car);
    car = new THREE.Group();
    car.add(model);
    car.position.set(0, 0.4, 0);
    car.rotation.y = CAR_ROTATION;
    scene.add(car);
    carModel = model;
  });

  // Load optional vegetation
  loadModel(ASSETS.trees, (model) => {
    const positions = [
      [-12, 0, -18],
      [12, 0, -18],
      [-12, 0, 18],
      [12, 0, 18],
      [-30, 0, 30],
      [30, 0, -30]
    ];

    positions.forEach(position => {
      const tree = model.clone(true);
      tree.position.set(...position);
      scene.add(tree);
    });
  });

  loadModel(ASSETS.buildings, (model) => {
    for (let i = 0; i < 12; i++) {
      const building = model.clone(true);
      building.position.set(
        (Math.random() - 0.5) * 250,
        0,
        (Math.random() - 0.5) * 250
      );
      scene.add(building);
    }
  });

  setTimeout(() => {
    loading.style.opacity = '0';
    setTimeout(() => {
      loading.style.display = 'none';
      hud.style.display = 'block';
    }, 800);
  }, 1500);
}

/* ==========================================
   INPUT
========================================== */

function setupControls() {
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;

    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
      e.preventDefault();
    }

    if (e.key.toLowerCase() === 'r') resetCar();
  });

  window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
  });

  document.querySelectorAll('.ctrl').forEach(button => {
    const key = button.dataset.key;

    button.addEventListener('pointerdown', e => {
      e.preventDefault();
      keys[key] = true;
      button.setPointerCapture(e.pointerId);
    });

    const release = () => keys[key] = false;

    button.addEventListener('pointerup', release);
    button.addEventListener('pointercancel', release);
    button.addEventListener('lostpointercapture', release);
  });

  document.getElementById('reset').addEventListener('click', resetCar);
}

function resetCar() {
  car.position.set(0, 0.4, 0);
  heading = CAR_ROTATION;
  car.rotation.y = heading;
  velocity = 0;
  steering = 0;
}

/* ==========================================
   DRIVING PHYSICS
========================================== */

function updateCar(dt) {
  const forward = keys.w || keys.arrowup;
  const backward = keys.s || keys.arrowdown;
  const left = keys.a || keys.arrowleft;
  const right = keys.d || keys.arrowright;
  const handbrake = keys[' '];

  if (forward) {
    velocity += CONFIG.acceleration * dt;
  } else if (backward) {
    velocity -= CONFIG.reverseAcceleration * dt;
  } else {
    const drag = CONFIG.friction * dt;
    if (velocity > 0) velocity = Math.max(0, velocity - drag);
    else velocity = Math.min(0, velocity + drag);
  }

  if (handbrake) velocity *= Math.pow(0.93, dt * 60);

  velocity = THREE.MathUtils.clamp(
    velocity,
    -CONFIG.maxReverse,
    CONFIG.maxSpeed
  );

  const steeringInput = (right ? 1 : 0) - (left ? 1 : 0);

  steering = THREE.MathUtils.damp(
    steering,
    steeringInput,
    7,
    dt
  );

  const speedFactor = Math.min(Math.abs(velocity) / 12, 1);

  heading += steering *
    CONFIG.steeringSpeed *
    speedFactor *
    Math.sign(velocity || 1) *
    dt;

  car.rotation.y = heading;

  car.position.x -= Math.sin(heading) * velocity * dt;
  car.position.z -= Math.cos(heading) * velocity * dt;

  // Animate wheels
  if (car.userData.wheels) {
    car.userData.wheels.forEach(wheel => {
      wheel.rotation.x += velocity * dt * 1.5;
    });
  }

  speedDisplay.textContent = Math.round(
    Math.abs(velocity) * 3.6
  );
}

/* ==========================================
   THIRD PERSON CAMERA
========================================== */

function updateCamera(dt) {
  const distance = CONFIG.cameraDistance;
  const height = CONFIG.cameraHeight;

  const desiredPosition = new THREE.Vector3(
    car.position.x + Math.sin(heading) * distance,
    car.position.y + height,
    car.position.z + Math.cos(heading) * distance
  );

  camera.position.lerp(
    desiredPosition,
    1 - Math.exp(-4 * dt)
  );

  const target = new THREE.Vector3(
    car.position.x,
    car.position.y + 1.2,
    car.position.z
  );

  camera.lookAt(target);
}

/* ==========================================
   RESIZE
========================================== */

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

/* ==========================================
   MAIN LOOP
========================================== */

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  updateCar(dt);
  updateCamera(dt);

  renderer.render(scene, camera);
}

init();

</script>
</body>
</html>
